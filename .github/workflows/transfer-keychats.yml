name: Apply Keychats transfer

on:
  push:
    branches:
      - keychats-transfer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part-* > /tmp/keychats-payload.tar.gz
          tar -xzf /tmp/keychats-payload.tar.gz -C .
          rm -rf .transfer
          rm -f .github/workflows/transfer-keychats.yml
          rm -f .github/workflows/keychats-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add dm receipts recovery and browser alerts'
          git push origin HEAD:keychats-transfer
