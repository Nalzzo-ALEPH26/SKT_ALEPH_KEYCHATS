
name: Import Keychats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Nalzzo-ALEPH26/SKT_ALEPH_Main_Repo
          ref: feature/keychats-v1
          path: _source
          sparse-checkout: keychats
          persist-credentials: false

      - name: Copy to keychats folder
        run: |
          mkdir -p keychats
          rsync -a _source/keychats/ keychats/
          rm -rf _source

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Import Keychats project"
          git push origin HEAD:main
